name: Retrieve Pending Games

# RETRIEVAL STAGE (decoupled pipeline).
# Fetches summaries from aoe4world and stores raw eco+non-eco blobs to R2 with
# D1 pointer rows. Advances pending_jobs: pending -> retrieved. No analysis.
#
# Points at v2 via CLOUDFLARE_D1_DATABASE_ID_V2 (add this repo secret =
# 67a5ef0e-8b13-4a05-b9bc-33142524aca0). The old process-games.yml keeps
# reading the v1 CLOUDFLARE_D1_DATABASE_ID secret — the two never collide.

on:
  # Hourly — retrieval is perishable, catch new games promptly.
  schedule:
    - cron: '0 * * * *'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max games to retrieve (default: 40)'
        required: false
        default: '40'

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Retrieve pending games
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID_V2 }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '40' }}"
          npx tsx scripts/retrieve-pending.ts --limit "$LIMIT"